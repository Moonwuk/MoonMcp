[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moonmcp"
version = "0.1.0"
description = "MoonMCP — a scope-aware bug-bounty & reconnaissance MCP server that works out of the box on the Python standard library and augments itself with your favourite CLI tools when present."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MoonMCP" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "bug-bounty",
    "reconnaissance",
    "recon",
    "security",
    "osint",
    "pentest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
# The whole point of MoonMCP is to work with (almost) zero dependencies.
# The only hard requirement is the MCP SDK itself.
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
# Nice-to-haves that improve accuracy but are never required — every module
# has a pure-stdlib fallback when these are missing.
enhanced = [
    "dnspython>=2.4",
]
# Enables the `screenshot` tool and the headless-browser tools (`browser_open`,
# `browser_eval`). Chromium still needs `playwright install chromium`.
screenshots = [
    "playwright>=1.40",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
moonmcp = "moonmcp.__main__:main"

[project.urls]
# Intentionally empty — no public repository URL is published to avoid
# fingerprinting the tool / author in PyPI metadata and SARIF exports.

[tool.hatch.build.targets.wheel]
packages = ["moonmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "timing: wall-clock-sensitive tests (real sleeps / elapsed assertions). Run them SERIALLY (not under xdist) so CPU contention from parallel workers doesn't flake the timing windows.",
    "integration: tests that talk to REAL services (see tests/integration/docker-compose.yml). Skipped unless MOONMCP_INTEGRATION=1; never run in the default suite / CI.",
]

[tool.coverage.run]
# Branch coverage, not just line coverage: the if/elif verdict branches where a
# detector's FP/FN decision lives are exactly what the correctness audit protects,
# so they must be MEASURED — a line can be "covered" while a false branch never runs.
branch = true
source = ["moonmcp"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# A shrinking type-checking baseline: every module is checked EXCEPT the three
# still-unclean ones below. server.py's errors are systemic (tool bodies return
# the `object`-typed output of shared helpers) and are best resolved alongside the
# planned per-family split; net.http (private http.client connection internals) and
# recon.openapi (untyped parsed-JSON access) are the remaining stragglers. This
# list only shrinks — do not add to it without driving the module clean first.
[[tool.mypy.overrides]]
module = [
    "moonmcp.server",
    "moonmcp.net.http",
    "moonmcp.recon.openapi",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
