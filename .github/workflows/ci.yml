name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project (with dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy moonmcp

      # The bulk of the suite runs in parallel (pytest-xdist); the wall-clock-sensitive
      # `timing` tests run SERIALLY afterwards so CPU contention from parallel workers
      # can't flake their elapsed-time assertions. Coverage is accumulated across both.
      - name: Test — parallel (non-timing)
        run: pytest -q -m "not timing" -n auto --cov=moonmcp --cov-report=

      - name: Test — serial (timing)
        run: pytest -q -m timing --cov=moonmcp --cov-append --cov-report=term-missing --cov-fail-under=70

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install project
        run: uv pip install --system -e .
      - name: Server capability check
        run: moonmcp --check
