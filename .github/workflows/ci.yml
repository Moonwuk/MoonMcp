name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project (with dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy moonmcp

      - name: Validate versioned knowledge catalogs
        run: python -m moonmcp.knowledge.validation

      - name: Evaluate deterministic private-read controls
        run: python -m moonmcp.evaluation --trials 1

      - name: Record five-trial deterministic comparison
        if: matrix.python-version == '3.11'
        run: python -m moonmcp.evaluation --trials 5 > discovery-evaluation.json

      - name: Preserve deterministic comparison report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: discovery-evaluation
          path: discovery-evaluation.json

      - name: Test (pytest + coverage gate)
        run: pytest -q --cov=moonmcp --cov-report=term-missing --cov-fail-under=70

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install browser test dependencies
        run: uv pip install --system -e ".[dev,screenshots]"
      - name: Install Chromium and system dependencies
        run: playwright install --with-deps chromium
      - name: Exercise browser guards and normal navigation
        run: pytest -q tests/test_browser.py tests/test_browser_guards.py

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install research test dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Preload the pinned trusted recipe image
        run: >-
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH
          docker --host=unix:///var/run/docker.sock pull
          python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      - name: Exercise actual HTTP, SQLite, isolation, worker loss and cleanup
        env:
          MOONMCP_TEST_DOCKER: "1"
        run: pytest -q tests/test_research_live.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Build distribution
        run: uv build
      - name: Install built wheel with runtime dependencies
        run: uv pip install --system dist/*.whl
      - name: Verify dependency resolution
        run: uv pip check --system
      - name: Server capability check
        run: moonmcp --check
      - name: Exercise installed wheel over MCP stdio
        run: env -u PYTHONPATH python -I scripts/mcp_smoke.py
